name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

  filesystem-security:
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Report all high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DISABLE_TELEMETRY: "true"
          TRIVY_IGNOREFILE: /dev/null
          TRIVY_SECRET_CONFIG: trivy-secret.yaml
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0"

      - name: Enforce security gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DISABLE_TELEMETRY: "true"
          TRIVY_IGNOREFILE: .trivyignore
          TRIVY_SECRET_CONFIG: trivy-secret.yaml
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          skip-setup-trivy: "true"

  image-build:
    needs: filesystem-security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image_ref: ${{ steps.image.outputs.ref }}
      image_digest: ${{ steps.publish.outputs.digest }}

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Define immutable image reference
        id: image
        shell: bash
        run: |
          image_ref="${REGISTRY}/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "ref=${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Build image
        shell: bash
        run: |
          docker build \
            --pull \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${{ steps.image.outputs.ref }}" \
            ./app

      - name: Report all high and critical image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DISABLE_TELEMETRY: "true"
          TRIVY_IGNOREFILE: /dev/null
          TRIVY_SECRET_CONFIG: trivy-secret.yaml
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0"

      - name: Enforce image security gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DISABLE_TELEMETRY: "true"
          TRIVY_IGNOREFILE: .trivyignore
          TRIVY_SECRET_CONFIG: trivy-secret.yaml
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          skip-setup-trivy: "true"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          docker push "${{ steps.image.outputs.ref }}"
          image_digest="$(docker image inspect \
            --format='{{index .RepoDigests 0}}' \
            "${{ steps.image.outputs.ref }}")"

          if [[ -z "${image_digest}" ]]; then
            echo "GHCR did not return an image digest." >&2
            exit 1
          fi

          echo "digest=${image_digest}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Published image"
            echo
            echo "\`${image_digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Record build-only result
        if: github.event_name != 'push' || github.ref != 'refs/heads/master'
        shell: bash
        run: |
          {
            echo "### Verified image"
            echo
            echo "Built and scanned \`${{ steps.image.outputs.ref }}\`."
            echo "Publishing is restricted to pushes on \`master\`."
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy-development:
    needs: image-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, releaseward-deploy]
    timeout-minutes: 10

    concurrency:
      group: releaseward-development
      cancel-in-progress: false

    environment:
      name: development

    permissions:
      contents: read

    env:
      IMAGE_DIGEST: ${{ needs.image-build.outputs.image_digest }}
      K3D_CLUSTER: releaseward
      K8S_NAMESPACE: releaseward-dev

    steps:
      - name: Check out trusted deployment manifests
        uses: actions/checkout@v6
        with:
          clean: true
          persist-credentials: false

      - name: Validate immutable deployment input
        shell: bash
        run: |
          expected_prefix="ghcr.io/${GITHUB_REPOSITORY,,}@sha256:"

          if [[ -z "${IMAGE_DIGEST}" || "${IMAGE_DIGEST}" != "${expected_prefix}"* ]]; then
            echo "Refusing invalid image digest: ${IMAGE_DIGEST}" >&2
            exit 1
          fi

          echo "Deploying ${IMAGE_DIGEST}"

      - name: Verify development cluster
        shell: bash
        run: |
          kubectl version --request-timeout=10s >/dev/null
          kubectl get deployments.apps \
            --namespace "${K8S_NAMESPACE}" \
            >/dev/null

          for permission in \
            "create deployments.apps" \
            "patch deployments.apps"; do
            read -r verb resource <<< "${permission}"
            kubectl auth can-i "${verb}" "${resource}" \
              --namespace "${K8S_NAMESPACE}" |
              grep --fixed-strings --line-regexp yes
          done

          for forbidden_permission in \
            "patch services" \
            "patch ingresses.networking.k8s.io" \
            "get secrets"; do
            read -r verb resource <<< "${forbidden_permission}"
            if kubectl auth can-i "${verb}" "${resource}" \
              --namespace "${K8S_NAMESPACE}" |
              grep --fixed-strings --line-regexp yes; then
              echo "Refusing overprivileged runner: ${verb} ${resource}" >&2
              exit 1
            fi
          done

      - name: Apply digest-pinned development Deployment
        shell: bash
        run: |
          kubectl set image \
            --filename k8s/deployment.yaml \
            "releaseward-demo=${IMAGE_DIGEST}" \
            --local \
            --output yaml |
            kubectl apply --filename -

          kubectl annotate \
            --namespace "${K8S_NAMESPACE}" \
            deployment/releaseward-demo \
            "kubernetes.io/change-cause=${GITHUB_SHA}" \
            "releaseward.dev/image-digest=${IMAGE_DIGEST}" \
            --overwrite

      - name: Verify rollout and ingress health
        shell: bash
        run: |
          kubectl rollout status \
            --namespace "${K8S_NAMESPACE}" \
            deployment/releaseward-demo \
            --timeout=120s

          smoke_test() {
            local path="$1"
            local expected="$2"
            local response

            for attempt in {1..15}; do
              if response="$(curl \
                --silent \
                --show-error \
                --fail \
                --header 'Host: releaseward.localhost' \
                "http://localhost:8080/${path}")"; then
                if [[ "${response}" == "${expected}" ]]; then
                  echo "${path}: ${response}"
                  return 0
                fi
              fi

              echo "Waiting for ${path} (attempt ${attempt}/15)..."
              sleep 2
            done

            echo "${path} did not return ${expected}." >&2
            return 1
          }

          smoke_test livez '{"status":"alive"}'
          smoke_test readyz '{"status":"ready"}'

      - name: Record development deployment
        shell: bash
        run: |
          {
            echo "### Development deployment"
            echo
            echo "- Cluster: \`${K3D_CLUSTER}\`"
            echo "- Namespace: \`${K8S_NAMESPACE}\`"
            echo "- Image: \`${IMAGE_DIGEST}\`"
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Health: \`/livez\` and \`/readyz\` passed through ingress"
          } >> "${GITHUB_STEP_SUMMARY}"

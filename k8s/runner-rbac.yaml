apiVersion: v1
kind: ServiceAccount
metadata:
  name: releaseward-deployer
  namespace: releaseward-dev
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: releaseward-deployer
  namespace: releaseward-dev
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: releaseward-deployer
  namespace: releaseward-dev
subjects:
  - kind: ServiceAccount
    name: releaseward-deployer
    namespace: releaseward-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: releaseward-deployer

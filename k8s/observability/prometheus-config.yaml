apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: releaseward-dev
  labels:
    releaseward.dev/component: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: releaseward-demo
        metrics_path: /metrics
        static_configs:
          - targets: ["releaseward-demo.releaseward-dev.svc.cluster.local:80"]

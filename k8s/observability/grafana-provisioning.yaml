apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: releaseward-dev
  labels:
    releaseward.dev/component: observability
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.releaseward-dev.svc.cluster.local:9090
        uid: releaseward-prometheus
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: releaseward-dev
  labels:
    releaseward.dev/component: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: releaseward
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/dashboards

apiVersion: apps/v1
kind: Deployment
metadata:
  name: releaseward-demo
  namespace: releaseward-dev
  labels:
    app: releaseward-demo
    releaseward.dev/environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: releaseward-demo
  template:
    metadata:
      labels:
        app: releaseward-demo
        releaseward.dev/environment: development
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: releaseward-demo
          image: releaseward-demo:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /livez
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 1
            periodSeconds: 3
